<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* The same two stones as the site: platinum on a light browser, lapis on a dark one. */
    .ground { fill: #f2f2f0; }
    .rule { fill: #17181a; }
    .mark { fill: #002fa7; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #0b1733; }
      .rule { fill: #eceff9; }
      .mark { fill: #9fb8f0; }
    }
  </style>
  <rect class="ground" width="32" height="32" rx="5" />
  <rect class="rule" x="7" y="8" width="18" height="2.5" />
  <rect class="rule" x="7" y="14.75" width="13" height="2.5" />
  <rect class="rule" x="7" y="21.5" width="18" height="2.5" />
  <rect class="mark" x="22.5" y="8" width="2.5" height="16" />
</svg>
