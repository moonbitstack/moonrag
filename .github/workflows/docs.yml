name: Docs

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: build the engine the demos call
        run: |
          moon build --target js src/examples/browser
          mkdir -p docs/engine
          cp "$(find _build/js -path '*examples/browser/browser.js' | head -n1)" docs/engine/moonrag.js

      - name: the API reference is up to date
        run: |
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html

      - name: the figures on the pages are up to date
        run: |
          python3 scripts/gen_site_numbers.py
          git diff --exit-code docs/index.html docs/guide.html docs/demo.html

      - name: configure pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v5
